name: Supabase Keep-Alive Ping

on:
  schedule:
    # Se ejecuta cada 6 horas (4 veces al día: 00:00, 06:00, 12:00, 18:00 UTC)
    # Supabase requiere actividad distribuida a lo largo de los días para no pausar el proyecto.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub Actions

jobs:
  keepalive:
    name: Ping Actividad Base de Datos
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Consultas de Actividad a Supabase
        run: |
          echo "Disparando pings de actividad a Postgres en Supabase..."
          
          # Query 1: Materias Primas
          HTTP_MATS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://ehlucvffwvevizrupccu.supabase.co/rest/v1/raw_materials?select=id&limit=1" \
            -H "apikey: sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2" \
            -H "Authorization: Bearer sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2")
          
          # Query 2: Preparaciones / Vitrina
          HTTP_PREPS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://ehlucvffwvevizrupccu.supabase.co/rest/v1/preparations?select=id&limit=1" \
            -H "apikey: sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2" \
            -H "Authorization: Bearer sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2")

          # Query 3: Comandas
          HTTP_ORDS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://ehlucvffwvevizrupccu.supabase.co/rest/v1/orders?select=id&limit=1" \
            -H "apikey: sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2" \
            -H "Authorization: Bearer sb_publishable_xamN6pN4NmxaxRIU9hXE5Q_H-B-eFd2")

          echo "Respuestas HTTP: raw_materials=$HTTP_MATS, preparations=$HTTP_PREPS, orders=$HTTP_ORDS"

          if [ "$HTTP_MATS" -eq 200 ] && [ "$HTTP_PREPS" -eq 200 ] && [ "$HTTP_ORDS" -eq 200 ]; then
            echo "✅ Consultas ejecutadas con éxito. Postgres registró actividad en múltiples tablas."
          else
            echo "⚠️ Alguna consulta falló. Revisa las claves o la conexión."
            exit 1
          fi
